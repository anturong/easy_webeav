<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{APP_NAME}} - 已退出</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg0:#08090f;--bg1:#0e1019;--bg2:#151825;--bd:#2a3050;--t1:#e8ecf8;--t2:#8a94b8;--t3:#525e80;--ac:#00d4aa;--r:8px;--rl:14px;--sh:0 10px 40px rgba(0,0,0,.6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 25% 25%,rgba(0,212,170,.07)0%,transparent 60%),radial-gradient(ellipse 50% 60% at 80% 75%,rgba(76,201,240,.05)0%,transparent 60%),var(--bg0)}
.grid{position:fixed;inset:0;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:60px 60px;opacity:.1;mask-image:radial-gradient(ellipse 70% 70% at center,black,transparent)}
.card{position:relative;z-index:2;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rl);padding:40px;width:420px;max-width:92vw;box-shadow:var(--sh);text-align:center;animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.icon{font-size:48px;color:var(--t3);margin-bottom:16px;opacity:.5}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
p{color:var(--t2);font-size:15px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 32px;background:var(--ac);color:#080a0f;text-decoration:none;border-radius:var(--r);font-size:15px;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.9}
.footer{margin-top:28px;font-size:12px;color:var(--t3)}
.footer a{color:var(--t3);text-decoration:none}
.footer a:hover{color:var(--ac)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="card">
<div class="icon"><i class="fas fa-arrow-right-from-bracket"></i></div>
<h1>已退出登录</h1>
<p>您已安全退出。</p>
<a class="btn" href="/login"><i class="fas fa-right-to-bracket"></i> 重新登录</a>
<div class="footer"><a href="{{AUTHOR_URL}}" target="_blank">{{AUTHOR}}</a> &middot; v{{VERSION}}</div>
</div>
</body>
</html>
